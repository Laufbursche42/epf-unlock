<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="pageTitle">Laufbursche EPF Tool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laufbursche <span data-t="brandSub"></span></h1>
    <div class="head-right">
      <span class="status" id="status" data-state="disconnected">disconnected</span>
      <div class="head-tools">
        <button type="button" class="theme-btn" id="btn-theme">&#9728;</button>
        <div class="langs" id="langs" role="group">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <div class="card">
    <h2 data-t="s1Title"></h2>
    <p class="hint" data-t="sub"></p>
    <p class="hint" data-t="startHintGuide"></p>
    <p class="warn" data-t="expWarn"></p>
    <p class="hint" data-t="ownDevice"></p>
  </div>

  <div class="card">
    <h2 data-t="s2Title"></h2>
    <div class="set-row">
      <label data-t="pwdLabel"></label>
      <input id="pwd-in" type="password" autocomplete="off">
    </div>
    <p class="hint" data-t="pwdHint"></p>
    <div class="btns">
      <button class="primary span2" id="btn-conn"></button>
    </div>
    <p class="hint" id="devinfo"></p>
    <p class="hint" data-t="controlsHint"></p>
  </div>

  <div class="card">
    <h2 data-t="liveTitle"></h2>
    <div class="grid">
      <div class="tile"><b id="t-speed">-</b><small data-t="tileSpeed"></small></div>
      <div class="tile"><b id="t-mode">-</b><small data-t="tileMode"></small></div>
      <div class="tile"><b id="t-batt">-</b><small data-t="tileBatt"></small></div>
      <div class="tile"><b id="t-lock">-</b><small data-t="tileLock"></small></div>
      <div class="tile"><b id="t-volt">-</b><small data-t="tileVolt"></small></div>
      <div class="tile"><b id="t-curr">-</b><small data-t="tileCurr"></small></div>
      <div class="tile"><b id="t-power">-</b><small data-t="tilePower"></small></div>
      <div class="tile"><b id="t-esctemp">-</b><small data-t="tileEscTemp"></small></div>
      <div class="tile"><b id="t-motortemp">-</b><small data-t="tileMotorTemp"></small></div>
      <div class="tile"><b id="t-trip">-</b><small data-t="tileTrip"></small></div>
      <div class="tile"><b id="t-total">-</b><small data-t="tileTotal"></small></div>
      <div class="tile"><b id="t-fw">-</b><small data-t="tileFw"></small></div>
    </div>
    <p class="hint" data-t="liveHint"></p>
  </div>

  <div class="card" id="speed-card">
    <h2 data-t="s3Title"></h2>
    <p class="warn" data-t="speedWarn"></p>
    <div class="set-row"><div class="lblrow"><label data-t="lblEco"></label><button type="button" class="help-btn" data-help="hEco" aria-label="Info">?</button></div><input id="lm1-in" type="number" min="0" max="255" step="1" value="6"></div>
    <div class="set-row"><div class="lblrow"><label data-t="lblComfort"></label><button type="button" class="help-btn" data-help="hComfort" aria-label="Info">?</button></div><input id="lm2-in" type="number" min="0" max="255" step="1" value="10"></div>
    <div class="set-row"><div class="lblrow"><label data-t="lblSport"></label><button type="button" class="help-btn" data-help="hSport" aria-label="Info">?</button></div><input id="lm3-in" type="number" min="0" max="255" step="1" value="20"></div>
    <div class="set-row"><div class="lblrow"><label data-t="lblCruise"></label><button type="button" class="help-btn" data-help="hCruise" aria-label="Info">?</button></div><input id="lc-in" type="number" min="0" max="255" step="1" value="3"></div>
    <div class="btns">
      <button class="primary" id="btn-write-limits" data-t="btnWriteLimits" disabled></button>
      <button id="btn-read-limits" data-t="btnReadLimits" disabled></button>
    </div>
    <p class="hint" id="limit-preview"></p>
    <p class="hint" data-t="tuningHint"></p>
  </div>

  <div class="card">
    <h2 data-t="setTitle"></h2>
    <div class="set-row">
      <div class="lblrow"><label data-t="lblGear"></label><button type="button" class="help-btn" data-help="hGear" aria-label="Info">?</button></div>
      <select id="gear-in"><option value="">-</option><option value="1" data-t="gear1"></option><option value="2" data-t="gear2"></option><option value="3" data-t="gear3"></option></select>
      <button id="btn-gear" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row">
      <div class="lblrow"><label data-t="lblHead"></label><button type="button" class="help-btn" data-help="hHead" aria-label="Info">?</button></div>
      <select id="head-in"><option value="">-</option><option value="1" data-t="optOn"></option><option value="0" data-t="optOff"></option></select>
      <button id="btn-head" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row">
      <div class="lblrow"><label data-t="lblAtmo"></label><button type="button" class="help-btn" data-help="hAtmo" aria-label="Info">?</button></div>
      <select id="atmo-in"><option value="">-</option><option value="1" data-t="optOn"></option><option value="0" data-t="optOff"></option></select>
      <button id="btn-atmo" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row">
      <div class="lblrow"><label data-t="lblCruiseSw"></label><button type="button" class="help-btn" data-help="hCruiseSw" aria-label="Info">?</button></div>
      <select id="cruise-in"><option value="">-</option><option value="1" data-t="optOn"></option><option value="0" data-t="optOff"></option></select>
      <button id="btn-cruise" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row">
      <div class="lblrow"><label data-t="lblBoot"></label><button type="button" class="help-btn" data-help="hBoot" aria-label="Info">?</button></div>
      <select id="boot-in"><option value="">-</option><option value="1" data-t="optOn"></option><option value="0" data-t="optOff"></option></select>
      <button id="btn-boot" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row">
      <div class="lblrow"><label data-t="lblUnit"></label><button type="button" class="help-btn" data-help="hUnit" aria-label="Info">?</button></div>
      <select id="unit-in"><option value="">-</option><option value="0" data-t="optKm"></option><option value="1" data-t="optMi"></option></select>
      <button id="btn-unit" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row">
      <div class="lblrow"><label data-t="lblLock"></label><button type="button" class="help-btn" data-help="hLock" aria-label="Info">?</button></div>
      <select id="lock-in"><option value="">-</option><option value="0" data-t="optOff"></option><option value="1" data-t="optOn"></option></select>
      <button id="btn-lock" data-t="btnSend" disabled></button>
    </div>
    <p class="hint" data-t="setHint"></p>
  </div>

  <div class="card">
    <h2 data-t="moreTitle"></h2>
    <div class="set-row"><div class="lblrow"><label data-t="lblName"></label><button type="button" class="help-btn" data-help="hName" aria-label="Info">?</button></div><input id="name-in" type="text" maxlength="20" disabled><button id="btn-name" data-t="btnSend" disabled></button></div>
    <div class="set-row"><div class="lblrow"><label data-t="lblNewPwd"></label><button type="button" class="help-btn" data-help="hNewPwd" aria-label="Info">?</button></div><input id="newpwd-in" type="password" disabled><button id="btn-setpwd" data-t="btnSend" disabled></button></div>
    <div class="set-row"><div class="lblrow"><label data-t="lblPwdProt"></label><button type="button" class="help-btn" data-help="hPwdProt" aria-label="Info">?</button></div><select id="pwdprot-in"><option value="">-</option><option value="1" data-t="optOn"></option><option value="0" data-t="optOff"></option></select><button id="btn-pwdprot" data-t="btnSend" disabled></button></div>
    <div class="set-row"><div class="lblrow"><label data-t="lblNfc"></label><button type="button" class="help-btn" data-help="hNfc" aria-label="Info">?</button></div><select id="nfc-in"><option value="">-</option><option value="1" data-t="optOn"></option><option value="0" data-t="optOff"></option></select><button id="btn-nfc" data-t="btnSend" disabled></button></div>
    <div class="set-row"><div class="lblrow"><label data-t="lblBlinker"></label><button type="button" class="help-btn" data-help="hBlinker" aria-label="Info">?</button></div><select id="blinker-in"><option value="">-</option><option value="1" data-t="optOn"></option><option value="0" data-t="optOff"></option></select><button id="btn-blinker" data-t="btnSend" disabled></button></div>
    <div class="set-row"><div class="lblrow"><label data-t="lblDrive"></label><button type="button" class="help-btn" data-help="hDrive" aria-label="Info">?</button></div><input id="drive-in" type="number" min="0" max="9" step="1" value="" disabled><button id="btn-drive" data-t="btnSend" disabled></button></div>
    <div class="btns">
      <button id="btn-delnfc" data-t="btnDelNfc" disabled></button>
      <button id="btn-resettrip" data-t="btnResetTrip" disabled></button>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2 data-t="advTitle"></h2><button type="button" class="help-btn" data-help="adv" aria-label="Info">?</button></div>
    <div class="doc-table"><table><thead><tr><th data-t="advField"></th><th data-t="advValue"></th></tr></thead><tbody id="adv-body"></tbody></table></div>
    <p class="hint" data-t="advHint"></p>
  </div>

  <div class="card">
    <h2 data-t="infoTitle"></h2>
    <div class="doc-table"><table><tbody id="info-body"></tbody></table></div>
    <div class="btns">
      <button id="btn-qdevice" data-t="btnQDevice" disabled></button>
      <button id="btn-quid" data-t="btnQUid" disabled></button>
      <button id="btn-qtype" class="span2" data-t="btnQType" disabled></button>
    </div>
  </div>

  <div class="card">
    <h2 data-t="s6Title"></h2>
    <div class="btns">
      <button type="button" id="btn-copy-log" data-t="btnCopyLog"></button>
      <button type="button" id="btn-clear-log" data-t="btnClearLog"></button>
      <button type="button" id="btn-diag" class="span2" data-t="btnDiag"></button>
    </div>
    <p class="hint" data-t="diagHint"></p>
    <pre id="log"></pre>
    <p class="hint"><span class="log-tx" data-t="logTxLegend"></span>, <span class="log-rx" data-t="logRxLegend"></span></p>
  </div>

  <footer class="foot">
    <span class="foot-links">
      <a id="link-guide" href="GUIDE.de.md" data-doc="GUIDE" data-t="footGuide"></a>
      <a href="https://github.com/Laufbursche42/epf-unlock" target="_blank" rel="noopener" data-t="footSource"></a>
      <a id="link-readme" href="README.md" data-doc="README" data-t="footReadme"></a>
      <a id="link-disclaimer" href="#" data-open-disclaimer data-t="footDisclaimer"></a>
      <a id="link-license" href="LICENSE.de.md" data-doc="LICENSE" data-t="footLicense"></a>
      <a id="link-privacy" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="footPrivacy"></a>
      <a id="link-trademarks" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="footTrademarks"></a>
    </span>
    <span class="ver" id="build-ver"></span>
  </footer>
</div>

<dialog id="doc" aria-labelledby="doc-title">
  <div class="doc-head">
    <h3 id="doc-title"></h3>
    <button type="button" id="doc-x">&times;</button>
  </div>
  <div class="doc-body" id="doc-body"></div>
  <div class="doc-foot">
    <button type="button" id="doc-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="help" aria-labelledby="help-title">
  <div class="doc-head">
    <h3 id="help-title"></h3>
    <button type="button" id="help-x">&times;</button>
  </div>
  <div class="doc-body"><p id="help-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="help-close" data-t="docClose"></button>
  </div>
</dialog>

<script src="i18n.js?v=7"></script>
<script src="protocol.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
